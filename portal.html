<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>TiltQuiz - Select Question Set</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&family=Poppins:wght@400;500;600;700;800&display=swap');

  :root {
    /* Colors taken directly from your index.html */
    --primary: #4f46e5;
    --primary-light: #6366f1;
    --secondary: #f59e0b;
    --bg: #0f0e17;
    --surface: #16213e;
    --text: #e2e8f0;
    --text-muted: #94a3b8;
    --border: #2d3748;
  }

  body {
    font-family: 'Nunito', sans-serif;
    background: linear-gradient(135deg, #0f0e17 0%, #1a1a3e 50%, #0f1729 100%);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 2rem;
  }

  .portal-container {
    text-align: center;
    width: 100%;
    max-width: 800px;
    z-index: 1;
  }

  .portal-title {
    font-family: 'Poppins', sans-serif;
    font-size: 3rem;
    font-weight: 800;
    background: linear-gradient(135deg, #ffffff 20%, #c7d2fe 60%, var(--secondary));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    margin-bottom: 2rem;
  }

  /* 4-Set Grid Layout */
  .selection-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 1.5rem;
    margin-bottom: 3rem;
  }

  .set-card {
    background: var(--surface);
    border: 2px solid var(--border);
    border-radius: 24px;
    padding: 2rem;
    cursor: pointer;
    transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
    text-decoration: none;
    color: white;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  .set-card:hover {
    transform: translateY(-10px);
    border-color: var(--primary);
    box-shadow: 0 20px 40px rgba(79, 70, 229, 0.3);
    background: rgba(79, 70, 229, 0.1);
  }

  .set-icon { font-size: 3rem; margin-bottom: 1rem; }
  .set-name { font-weight: 800; font-size: 1.4rem; margin-bottom: 0.5rem; }
  .set-desc { color: var(--text-muted); font-size: 0.9rem; }

  .btn-back {
    background: rgba(255,255,255,0.04);
    color: #94a3b8;
    border: 1.5px solid rgba(255,255,255,0.1);
    padding: 0.8rem 2rem;
    border-radius: 12px;
    cursor: pointer;
    font-family: 'Nunito', sans-serif;
    font-weight: 700;
    transition: all 0.3s;
    text-decoration: none;
  }

  .btn-back:hover {
    border-color: var(--primary);
    color: white;
  }

  @media (max-width: 600px) {
    .selection-grid { grid-template-columns: 1fr; }
    .portal-title { font-size: 2.2rem; }
  }
</style>
</head>
<body>
  <div class="portal-container">
    <h1 class="portal-title">Select Question Set</h1>
    
    <div class="selection-grid">
      <a href="index.html?set=1" class="set-card">
        <div class="set-icon">🧬</div>
        <div class="set-name">Science</div>
        <div class="set-desc">10 Questions</div>
      </a>

      <a href="index.html?set=2" class="set-card">
        <div class="set-icon">🌍</div>
        <div class="set-name">Geography</div>
        <div class="set-desc">10 Questions</div>
      </a>

      <a href="index.html?set=3" class="set-card">
        <div class="set-icon">📜</div>
        <div class="set-name">History</div>
        <div class="set-desc">10 Questions</div>
      </a>

      <a href="index.html?set=4" class="set-card">
        <div class="set-icon">💻</div>
        <div class="set-name">Technology</div>
        <div class="set-desc">10 Questions</div>
      </a>
    </div>

    <a href="index.html" class="btn-back">Back to Main</a>
  </div>
</body>
</html>
