<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>TiltQuiz - Head Tilt Learning Game</title>
<style> 
  @import url('https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&family=Poppins:wght@400;500;600;700;800&display=swap');

  :root {
    --primary: #4f46e5;
    --primary-light: #6366f1;
    --secondary: #f59e0b;
    --success: #10b981;
    --danger: #ef4444;
    --left-color: #3b82f6;
    --right-color: #f97316;
    --bg: #0f0e17;
    --card-bg: #1a1a2e;
    --surface: #16213e;
    --text: #e2e8f0;
    --text-muted: #94a3b8;
    --border: #2d3748;
    --shadow: 0 25px 50px rgba(0,0,0,0.5);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Nunito', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* ===== SCREENS ===== */
  .screen { display: none; min-height: 100vh; }
  .screen.active { display: flex; flex-direction: column; }

  /* ===== MAIN PAGE / PORTAL ===== */
  #mainPage {
    background: linear-gradient(135deg, #0f0e17 0%, #1a1a3e 50%, #0f1729 100%);
    align-items: center;
    justify-content: center;
    position: relative;
    overflow: hidden;
  }

  .main-content {
    text-align: center;
    z-index: 1;
    padding: 2rem;
    animation: fadeInUp 0.8s ease;
    display: flex;
    flex-direction: column;
    align-items: center;
    width: 100%;
  }

  .main-title {
    font-family: 'Poppins', sans-serif;
    font-size: 3.2rem;
    font-weight: 800;
    background: linear-gradient(135deg, #ffffff 20%, #c7d2fe 60%, var(--secondary));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    margin-bottom: 0.5rem;
  }

  /* Portal Grid Styling */
  .selection-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 1.2rem;
    width: 100%;
    max-width: 500px;
    margin-top: 2rem;
  }

  .set-card {
    background: var(--surface);
    border: 2px solid var(--border);
    border-radius: 22px;
    padding: 1.5rem 1rem;
    cursor: pointer;
    transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
    text-align: center;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  .set-card:hover {
    transform: translateY(-8px);
    border-color: var(--primary);
    box-shadow: 0 15px 35px rgba(79, 70, 229, 0.3);
    background: rgba(79, 70, 229, 0.1);
  }

  .set-icon { font-size: 2.2rem; margin-bottom: 0.5rem; }
  .set-name { font-weight: 800; font-size: 1.1rem; color: white; }
  .set-desc { color: var(--text-muted); font-size: 0.8rem; }

  /* Reuse your existing btn-main styles for Teacher Dashboard */
  .btn-main {
    padding: 0.95rem 3rem;
    border-radius: 14px;
    font-family: 'Nunito', sans-serif;
    font-size: 1rem;
    font-weight: 800;
    cursor: pointer;
    border: none;
    transition: all 0.3s ease;
    width: 100%;
    max-width: 320px;
    margin-top: 1.5rem;
    background: rgba(255,255,255,0.04);
    color: #94a3b8;
    border: 1.5px solid rgba(255,255,255,0.1);
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 0.5rem;
  }

  .btn-main:hover { border-color: var(--primary); color: #e2e8f0; background: rgba(79,70,229,0.08); }

  @keyframes fadeInUp {
    from { opacity:0; transform:translateY(30px); }
    to { opacity:1; transform:translateY(0); }
  }

  @media (max-width: 480px) {
    .selection-grid { grid-template-columns: 1fr; }
    .main-title { font-size: 2.5rem; }
  }
</style>
</head>
<body>

  <div id="mainPage" class="screen active">
    <div class="main-content">
      <h1 class="main-title">TiltQuiz</h1>
      <p style="color: var(--text-muted);">Select a category to start playing</p>
      
      <div class="selection-grid">
        <div class="set-card" onclick="selectSet(0)">
          <div class="set-icon">🧬</div>
          <div class="set-name">Science</div>
          <div class="set-desc">10 Questions</div>
        </div>

        <div class="set-card" onclick="selectSet(1)">
          <div class="set-icon">🌍</div>
          <div class="set-name">Geography</div>
          <div class="set-desc">10 Questions</div>
        </div>

        <div class="set-card" onclick="selectSet(2)">
          <div class="set-icon">📜</div>
          <div class="set-name">History</div>
          <div class="set-desc">10 Questions</div>
        </div>

        <div class="set-card" onclick="selectSet(3)">
          <div class="set-icon">💻</div>
          <div class="set-name">Technology</div>
          <div class="set-desc">10 Questions</div>
        </div>
      </div>

      <button class="btn-main" onclick="openTeacherPanel()">
        ⚙️ Teacher Dashboard
      </button>
    </div>
  </div>

  <script>
    // New function to handle portal selection
    function selectSet(setIndex) {
        if(typeof sfx !== 'undefined') sfx.click(); // Play your existing click sound
        console.log("Loading Set:", setIndex);
        
        // Logic to swap question sets goes here
        startGame();
    }

    // Include all your existing Game logic, Camera handling, and sfx objects here
    //
  </script>
</body>
</html>
